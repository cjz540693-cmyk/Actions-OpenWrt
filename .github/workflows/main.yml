name: Build Ruijie X60 OpenWrt Firmware

on:
  # 触发条件：推送到 main/master 分支，或手动触发
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:   # 允许手动触发
    inputs:
      version:
        description: '固件版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

# 环境变量配置
env:
  # 核心配置
  REPO_URL: "https://github.com/cjz540693-cmyk/immortalwrt-mt798x-6.6-padavanonly"  # 源码仓库
  REPO_BRANCH: "openwrt-24.10"  # 分支
  FEEDS_CONF: "feeds.conf.default"  # feeds 配置文件
  
  # 设备特定配置
  TARGET: "mediatek"  # 目标平台
  SUBTARGET: "filogic"  # 子目标
  DEVICE_NAME: "ruijie_x60"  # 设备名称
  DEVICE_PROFILE: "ruijie_x60"  # 设备配置文件
  
  # 编译配置
  JOB_NUM: 4  # 并行编译任务数
  BUILD_THREADS: "$(($(nproc) + 1))"  # 编译线程数
  DOWNLOAD_DIR: "dl"  # 下载目录
  BUILD_LOG_DIR: "logs"  # 日志目录

# 工作流定义
jobs:
  # 检查工作流
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build_version: ${{ steps.check.outputs.build_version }}
    
    steps:
      - name: Check workflow trigger
        id: check
        run: |
          # 检查是否为手动触发
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "手动触发构建"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "build_version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # 检查是否只修改了文档文件
            git fetch origin ${{ github.ref }}
            FILES_CHANGED=$(git diff --name-only origin/${{ github.ref }} ${{ github.sha }}~1)
            DOC_FILES_ONLY=$(echo "$FILES_CHANGED" | grep -vE '\.(yml|yaml|sh|conf|config|md|txt)$' | wc -l)
            
            if [ "$DOC_FILES_ONLY" -eq 0 ]; then
              echo "只修改了文档，跳过构建"
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "代码有变更，开始构建"
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "build_version=$(date +'v%Y.%m.%d')" >> $GITHUB_OUTPUT
            fi
          else
            echo "默认构建"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "build_version=$(date +'v%Y.%m.%d')" >> $GITHUB_OUTPUT
          fi

  # 构建固件
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    container:
      image: immortalwrt/opde:base-ubuntu-22.04
      options: --privileged
    
    steps:
      # 1. 准备环境
      - name: Checkout source code
        run: |
          echo "开始克隆源码..."
          git clone --depth=1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH}} openwrt
          cd openwrt
          
      - name: Setup environment
        run: |
          echo "设置编译环境..."
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget
          
      # 2. 更新 feeds
      - name: Update feeds
        run: |
          echo "更新 feeds..."
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      # 3. 应用配置（锐捷 X60 特定）
      - name: Apply configuration for Ruijie X60
        run: |
          echo "配置锐捷 X60 编译参数..."
          cd openwrt
          
          # 创建默认配置
          cat > .config << EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_ruijie_x60=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          EOF
          
          # 应用配置
          make defconfig
          
      # 4. 下载依赖
      - name: Download dependencies
        run: |
          echo "下载依赖包..."
          cd openwrt
          make -j${{ env.JOB_NUM }} download
          
      # 5. 编译工具链
      - name: Build toolchain
        run: |
          echo "编译工具链..."
          cd openwrt
          make -j${{ env.JOB_NUM }} tools/compile
          make -j${{ env.JOB_NUM }} toolchain/compile
          
      # 6. 编译固件
      - name: Build firmware
        run: |
          echo "开始编译固件..."
          cd openwrt
          
          # 使用多线程编译
          make -j${{ env.BUILD_THREADS }} V=s 2>&1 | tee build.log
          
          # 检查编译结果
          if [ -f "bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/openwrt-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.DEVICE_PROFILE }}-squashfs-sysupgrade.bin" ]; then
            echo "固件编译成功！"
            echo "BUILD_STATUS=success" >> $GITHUB_ENV
          else
            echo "固件编译失败！"
            echo "BUILD_STATUS=failed" >> $GITHUB_ENV
            exit 1
          fi
          
      # 7. 重命名固件
      - name: Rename firmware
        run: |
          echo "重命名固件文件..."
          cd openwrt
          FIRMWARE_FILE="bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/openwrt-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.DEVICE_PROFILE }}-squashfs-sysupgrade.bin"
          NEW_NAME="openwrt-immortalwrt-${{ env.DEVICE_NAME }}-${{ needs.check.outputs.build_version }}-sysupgrade.bin"
          
          if [ -f "$FIRMWARE_FILE" ]; then
            cp "$FIRMWARE_FILE" "../$NEW_NAME"
            echo "固件已重命名为: $NEW_NAME"
            echo "FIRMWARE_PATH=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "找不到固件文件！"
            exit 1
          fi
          
      # 8. 保存编译产物
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruijie-x60-firmware
          path: ${{ env.FIRMWARE_PATH }}
          retention-days: 7
          
      # 9. 保存编译日志
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 7

  # 发布固件
  release:
    needs: [check, build]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    
    steps:
      # 1. 下载编译产物
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ruijie-x60-firmware
          
      # 2. 创建 Release
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check.outputs.build_version }}
          name: "锐捷 X60 固件 ${{ needs.check.outputs.build_version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.bin
          body: |
            ## 锐捷 X60 OpenWrt 固件
            
            **版本**: ${{ needs.check.outputs.build_version }}
            **编译时间**: ${{ github.run_created_at }}
            **源码分支**: ${{ env.REPO_BRANCH }}
            
            ### 刷机说明
            1. 进入路由器原厂固件后台
            2. 找到固件升级页面
            3. 上传本固件文件
            4. 等待刷机完成
            
            ### 默认配置
            - IP地址: 192.168.1.1
            - 用户名: root
            - 密码: 无
            
            ### 包含功能
            - LuCI Web 管理界面
            - 基本防火墙设置
            - 软件包管理
            - 完整的网络功能
            
            ### 注意事项
            - 刷机有风险，请备份原厂固件
            - 首次启动可能需要 3-5 分钟
            - 建议刷机后恢复出厂设置
            
      # 3. 上传到 Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check.outputs.build_version }}
          files: |
            *.bin

  # 清理工作
  cleanup:
    needs: [check, build, release]
    if: always()
    runs-on: ubuntu-22.04
    
    steps:
      - name: Clean up workspace
        run: |
          echo "清理工作空间..."
          rm -rf *
          
      - name: Send notification
        if: ${{ failure() }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-notifications'  # 修改为你的 Slack 频道
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
