name: Build OpenWrt X60

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ 安装依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3 python3-pip python3-setuptools rsync unzip zlib1g-dev file wget curl

      # 3️⃣ 更新并安装 Feeds
      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4️⃣ 配置 X60 固件
      - name: Configure X60 target
        run: |
          cp target/linux/mediatek/mt7986/config-5.10 .config
          make defconfig
          # 可选开启常用插件，如 LuCI、Tailscale
          scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_tailscale=y" >> .config
          make defconfig

      # 5️⃣ 编译固件
      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      # 6️⃣ 上传编译产物
      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: X60-firmware
          path: bin/targets/mediatek/mt7986/
