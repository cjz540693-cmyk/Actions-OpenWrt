name: Build Ruijie X60 OpenWrt Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: '固件版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  REPO_URL: "https://github.com/immortalwrt/immortalwrt"
  REPO_BRANCH: "openwrt-23.05"
  TARGET: "mediatek"
  SUBTARGET: "filogic"
  DEVICE_NAME: "ruijie_x60"

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build_version: ${{ steps.check.outputs.build_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set build variables
        id: check
        run: |
          echo "should_build=true" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "build_version=v$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04  # ✅ 直接使用 Runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          echo "设置编译环境..."
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget ccache
          
      - name: Clone source code
        run: |
          echo "开始克隆源码..."
          git clone --depth=1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: Apply configuration
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_ruijie_x60=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          EOF
          make defconfig
          
      - name: Download dependencies
        run: |
          cd openwrt
          make -j$(nproc) download
          
      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ruijie-x60-firmware-${{ needs.check.outputs.build_version }}
          path: openwrt/bin/targets/*/*/*.bin
          retention-days: 30

  release:
    needs: [check, build]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: ruijie-x60-firmware-${{ needs.check.outputs.build_version }}
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check.outputs.build_version }}
          name: "锐捷 X60 固件 ${{ needs.check.outputs.build_version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: "*.bin"
