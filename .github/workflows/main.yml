name: Build X60 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk gettext unzip file git \
            python3 python3-pip python3-setuptools rsync zlib1g-dev wget curl

      - name: Show directory structure
        run: |
          echo "--- Listing root files ---"
          ls -R .

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply X60 config (MT7986)
        run: |
          cp -f defconfig/mt7986-ax6000.config .config
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X60-firmware
          path: bin/targets/mediatek/mt7986/
