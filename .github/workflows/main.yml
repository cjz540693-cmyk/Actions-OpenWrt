name: Build OpenWrt X60

on:
  workflow_dispatch:

jobs:
  build:
    name: Build X60 Firmware
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 设置缓存（加速编译）
      - name: Cache feeds and downloads
        uses: actions/cache@v3
        with:
          path: |
            feeds
            dl
          key: ${{ runner.os }}-openwrt-cache

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk gettext unzip file git python3 python3-distutils

      # 4️⃣ 更新 feeds
      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5️⃣ 配置 X60 默认机型
      - name: Configure X60 target
        run: |
          cp configs/x60_defconfig .config
          make defconfig

      # 6️⃣ 编译固件
      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      # 7️⃣ 上传编译产物
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: X60-firmware
          path: bin/targets/mediatek/mt7986/
