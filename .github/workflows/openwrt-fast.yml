name: OpenWrt 237 X60 Tailscale UI Stable

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ===== feeds =====
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ===== ⭐ 加稳定 tailscale UI（带重试）=====
    - name: Add Tailscale UI
      run: |
        cd openwrt

        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999

        for i in 1 2 3; do
          git clone https://github.com/ophub/luci-app-tailscale package/luci-app-tailscale && break || sleep 5
        done

    # ===== config =====
    - name: Load config
      run: |
        mv seed.config openwrt/.config
        cd openwrt
        make defconfig

    # ===== 写入插件（防丢）=====
    - name: Inject packages
      run: |
        cd openwrt

        cat >> .config <<EOF

        # LuCI
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl-openssl=y

        # 中文
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

        # 主题
        CONFIG_PACKAGE_luci-theme-bootstrap=y

        # Tailscale
        CONFIG_PACKAGE_tailscale=y
        CONFIG_PACKAGE_luci-app-tailscale=y

        # 工具
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_bash=y

        EOF

        make defconfig

    # ===== 下载 =====
    - name: Download
      run: |
        cd openwrt
        make download -j8

    # ===== 编译（防炸核心）=====
    - name: Compile
      run: |
        cd openwrt

        # 限制Go并发（关键）
        export GOMAXPROCS=2

        # 三段式编译（防失败）
        make -j$(nproc) || make -j2 || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: X60-237-TailscaleUI
        path: openwrt/bin/targets/
