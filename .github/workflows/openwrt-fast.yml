name: X60 FULL STABLE (FINAL)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: 拉源码
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加入本地插件（你的UI就在这）
      run: |
        cp -r package openwrt/ || true

    - name: 加载配置
      run: |
        cp config/x60.config openwrt/.config
        cd openwrt
        make defconfig

        echo "===== 检查设备 ====="
        grep rg-x60 .config || (echo "❌ 没选中X60" && exit 1)

    - name: 应用自定义脚本（防报错版）
      run: |
        [ -f scripts/diy.sh ] && chmod +x scripts/diy.sh && (cd openwrt && ../scripts/diy.sh) || echo "跳过 diy.sh"

    - name: 下载源码包
      run: |
        cd openwrt
        make download -j8

    - name: 编译（防炸版）
      run: |
        cd openwrt
        export GOMAXPROCS=2

        make -j$(nproc) || make -j2 || make -j1 V=s || (echo "❌ 编译失败" && exit 1)

    - name: 查找固件（已修复）
      run: |
        echo "===== 固件列表 ====="
        find openwrt/bin/targets -type f || (echo "❌ 没有生成固件" && exit 1)

        echo "===== 查找bin ====="
        BIN=$(find openwrt/bin/targets -name "*.bin" | head -n 1)

        if [ -z "$BIN" ]; then
          echo "❌ 没找到固件文件"
          exit 1
        fi

        echo "✅ 找到固件: $BIN"

    - name: 上传固件（最终）
      uses: actions/upload-artifact@v4
      with:
        name: X60-FIRMWARE
        path: openwrt/bin/targets/
