name: OpenWrt X60 LOCKED BUILD

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ===== feeds =====
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ===== 拉 tailscale UI（带失败检测）=====
    - name: Add Tailscale UI
      run: |
        cd openwrt

        for i in 1 2 3; do
          git clone https://github.com/ophub/luci-app-tailscale package/luci-app-tailscale && break || sleep 5
        done

        [ -d package/luci-app-tailscale ] || (echo "❌ tailscale UI 拉取失败" && exit 1)

    # ===== 加载基础配置 =====
    - name: Load config
      run: |
        mv seed.config openwrt/.config
        cd openwrt
        make defconfig

        echo "===== 检查设备 ====="
        grep rg-x60 .config || (echo "❌ 没选中 X60" && exit 1)

    # ===== 注入插件（锁死）=====
    - name: Inject packages
      run: |
        cd openwrt

        cat >> .config <<EOF

        # ===== LuCI =====
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl-openssl=y

        # ===== 中文 =====
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

        # ===== 主题（237稳定）=====
        CONFIG_PACKAGE_luci-theme-bootstrap=y

        # ===== Tailscale =====
        CONFIG_PACKAGE_tailscale=y
        CONFIG_PACKAGE_luci-app-tailscale=y

        # ===== 工具 =====
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_bash=y

        EOF

        make defconfig

        echo "===== 检查插件 ====="
        grep CONFIG_PACKAGE_tailscale=y .config || (echo "❌ tailscale 被删" && exit 1)
        grep luci-app-tailscale .config || (echo "❌ luci-app-tailscale 被删" && exit 1)

    # ===== 下载 =====
    - name: Download
      run: |
        cd openwrt
        make download -j8

    # ===== 编译（防炸版）=====
    - name: Compile
      run: |
        cd openwrt

        # 限制Go并发（关键）
        export GOMAXPROCS=2

        # 三段式防炸
        make -j$(nproc) || make -j2 || make -j1 V=s

    # ===== 固件检查（终极锁）=====
    - name: Check firmware
      run: |
        cd openwrt/bin/targets/*/*

        echo "===== 固件列表 ====="
        ls

        # 必须包含 x60
        ls | grep -i x60 || (echo "❌ 不是X60固件" && exit 1)

    # ===== 上传 =====
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: X60-LOCKED
        path: openwrt/bin/targets/
