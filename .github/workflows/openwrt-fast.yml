name: X60 FULL STABLE (LOCAL UI)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: 拉源码
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加入本地插件
      run: |
        cp -r package openwrt/

    - name: 加载配置
      run: |
        cp config/x60.config openwrt/.config
        cd openwrt
        make defconfig

        grep rg-x60 .config || (echo "❌ 不是X60" && exit 1)
        grep tailscale .config || (echo "❌ tailscale没进" && exit 1)

    - name: 应用脚本
      run: |
        chmod +x scripts/diy.sh
        cd openwrt
        ../scripts/diy.sh

    - name: 下载
      run: |
        cd openwrt
        make download -j8

    - name: 编译
      run: |
        cd openwrt
        export GOMAXPROCS=2
        make -j$(nproc) || make -j2 || make -j1 V=s

    - name: 校验
      run: |
        cd openwrt/bin/targets/*/*
        ls | grep x60 || exit 1

    - name: 上传
      uses: actions/upload-artifact@v4
      with:
        name: X60-UI-STABLE
        path: openwrt/bin/targets/
