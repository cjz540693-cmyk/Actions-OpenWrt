name: OpenWrt Tailscale UI Stable

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ===== feeds =====
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ===== ⭐ 用更稳的 tailscale UI 源 =====
    - name: Add Tailscale UI
      run: |
        cd openwrt
        git clone https://github.com/sirpdboy/luci-app-tailscale package/luci-app-tailscale

    # ===== config =====
    - name: Load config
      run: |
        mv seed.config openwrt/.config
        cd openwrt
        make defconfig

    # ===== 写入插件 =====
    - name: Inject packages
      run: |
        cd openwrt

        cat >> .config <<EOF

        # LuCI
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl-openssl=y
        CONFIG_PACKAGE_luci-compat=y

        # 中文
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

        # 主题（轻量稳定）
        CONFIG_PACKAGE_luci-theme-bootstrap=y

        # Tailscale + UI
        CONFIG_PACKAGE_tailscale=y
        CONFIG_PACKAGE_luci-app-tailscale=y

        # 工具
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_bash=y

        EOF

        make defconfig

    # ===== 下载 =====
    - name: Download
      run: |
        cd openwrt
        make download -j8

    # ===== 编译（关键稳法）=====
    - name: Compile
      run: |
        cd openwrt

        # 限制Go并发（防OOM）
        export GOMAXPROCS=2

        # 三段式编译（防失败）
        make -j$(nproc) || make -j2 || make -j1 V=s

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: X60-Tailscale-UI
        path: openwrt/bin/targets/
