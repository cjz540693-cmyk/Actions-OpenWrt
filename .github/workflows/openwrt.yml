name: OpenWrt Stable Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: seed.config
  TZ: Asia/Tokyo

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone source
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ⭐ 必须：feeds
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    # ⭐ 核心（已修复 scripts/config 问题）
    - name: Load config + LOCK (FIXED)
      run: |
        mv $CONFIG_FILE openwrt/.config
        cd openwrt

        make defconfig

        # 👉 使用 scripts/config（无 ./）
        scripts/config --enable CONFIG_PACKAGE_luci
        scripts/config --enable CONFIG_PACKAGE_luci-base
        scripts/config --enable CONFIG_PACKAGE_luci-ssl-openssl
        scripts/config --enable CONFIG_PACKAGE_luci-compat
        scripts/config --enable CONFIG_PACKAGE_luci-app-opkg

        scripts/config --enable CONFIG_PACKAGE_luci-theme-argon

        scripts/config --enable CONFIG_PACKAGE_tailscale
        scripts/config --enable CONFIG_PACKAGE_luci-app-tailscale

        scripts/config --enable CONFIG_PACKAGE_kmod-mt7915e
        scripts/config --enable CONFIG_PACKAGE_wpad-openssl

        scripts/config --enable CONFIG_PACKAGE_firewall4
        scripts/config --enable CONFIG_PACKAGE_nftables

        scripts/config --enable CONFIG_PACKAGE_htop
        scripts/config --enable CONFIG_PACKAGE_nano
        scripts/config --enable CONFIG_PACKAGE_bash

        scripts/config --enable CONFIG_PACKAGE_irqbalance

        make defconfig

    - name: Download packages
      run: |
        cd openwrt
        make download -j8

    - name: Compile firmware
      run: |
        cd openwrt
        make -j$(nproc)

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: X60-Stable
        path: openwrt/bin/targets/
