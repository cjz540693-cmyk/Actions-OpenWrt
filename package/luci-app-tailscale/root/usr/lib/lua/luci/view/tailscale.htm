<%+header%>

<h2>Tailscale</h2>

<p>当前状态：</p>
<pre><%=luci.sys.exec("tailscale status 2>/dev/null")%></pre>

<form method="post">
    <input type="submit" name="up" value="启动 Tailscale">
</form>

<%
if luci.http.formvalue("up") then
    luci.sys.call("tailscale up --accept-routes &")
end
%>

<%+footer%>
